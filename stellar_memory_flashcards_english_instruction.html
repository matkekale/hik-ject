<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Memory Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.06) 1.5px, transparent 1.5px);
            background-size: 100px 100px, 150px 150px, 200px 200px;
            font-family: 'Lora', serif;
            color: #fdfbf7;
        }

        /* 3D Flip Card CSS */
        .perspective {
            perspective: 1000px;
        }
        
        .flipper {
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .flipped .flipper {
            transform: rotateY(180deg);
        }

        .front, .back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            /* Styling border matching the reference */
            border: 4px solid #6b1428; 
            background-color: #fdfbf7;
        }

        .back {
            transform: rotateY(180deg);
            padding: 1.5rem;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Custom Scrollbar untuk bagian belakang kartu */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(107, 20, 40, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(107, 20, 40, 0.7);
        }

        /* Star Glow Effect Placeholder */
        .star-container {
            position: relative;
            width: 100%;
            height: 65%;
            background: #020205; /* Deep space black */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Twinkling background dust for the star container */
        .star-container::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.3;
            transform: rotate(45deg);
        }

        .star-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            position: relative;
            z-index: 10;
        }

        .front img { display: block; object-position: center; }
        .perspective:focus-visible { outline: 3px solid #f9d48f; outline-offset: 5px; border-radius: 10px; }
        @media (prefers-reduced-motion: reduce) { .flipper { transition-duration: .01ms; } }

        /* Title Font */
        .font-title {
            font-family: 'Cinzel', serif;
        }
        
        .number-badge {
            background-color: #6b1428;
            border: 2px solid #fdfbf7;
            color: #fdfbf7;
        }
    </style>
</head>

                Stellar Memory Archives

                    "Bintang putih keemasan yang sangat terang, memiliki semburat sinar tajam dan inti bercahaya kuat yang mudah dikenali.",
                    "Teramati di kawasan Rasi Helion, terutama pada sektor R-9, dan kadang terlihat dekat gugus kecil bintang-bintang redup.",
                    "Dalam catatan pengamatan, objek ini memiliki urutan terbit malam ke-5 dan intensitas sinyal sebesar 88 unit astronomi."
                ]

        ];

        const gridContainer = document.getElementById('flashcard-grid');

        // Render Cards
        starsData.forEach(star => {
            // Create Card Wrapper
            const cardWrapper = document.createElement('div');
            cardWrapper.className = 'perspective h-[450px] w-full';
            cardWrapper.tabIndex = 0;
            cardWrapper.setAttribute('role', 'button');
            cardWrapper.setAttribute('aria-label', 'Balik kartu ' + star.name);

            // Create Inner Flipper
            const flipper = document.createElement('div');
            flipper.className = 'flipper';
            flipper.addEventListener('click', function() {
                this.closest('.perspective').classList.toggle('flipped');
            });
            cardWrapper.addEventListener('keydown', function(event) {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    this.classList.toggle('flipped');
                }
            });

            // --- FRONT OF CARD ---
            const front = document.createElement('div');
            front.className = 'front flex flex-col bg-[#fdfbf7]';

            // Image Container
            const starContainer = document.createElement('div');
            starContainer.className = 'relative h-[65%] w-full border-b-4 border-[#6b1428] overflow-hidden bg-black';
            
            // Number Badge
            const badge = document.createElement('div');
            badge.className = 'number-badge absolute top-3 left-3 w-10 h-10 rounded-full flex items-center justify-center font-bold z-20 shadow-md text-lg';
            badge.innerText = star.id;
            
            // Real Image Element
            const starImg = document.createElement('img');
            starImg.src = star.image;
            starImg.alt = star.name;
            starImg.className = 'w-full h-full object-cover';
            starImg.loading = 'lazy';
            starImg.decoding = 'async';

            starContainer.appendChild(badge);
            starContainer.appendChild(starImg);

            // Title Container
            const titleContainer = document.createElement('div');
            titleContainer.className = 'h-[35%] bg-[#fdfbf7] flex flex-col items-center justify-center p-4 text-center';
            
            const starName = document.createElement('h2');
            starName.className = 'text-xl font-bold font-title text-[#1f2937] leading-tight';
            starName.innerText = star.name;

            const latinName = document.createElement('p');
            latinName.className = 'text-lg italic text-[#4b5563] mt-1';
            latinName.innerText = `(${star.latin})`;

            titleContainer.appendChild(starName);
            titleContainer.appendChild(latinName);

            front.appendChild(starContainer);
            front.appendChild(titleContainer);


            // --- BACK OF CARD ---
            const back = document.createElement('div');
            // FIX CRITICAL: Menambahkan overflow, scrollbar khusus, border-box, padding proporsional, font lebih kecil, dan justify-start
            back.className = 'back custom-scrollbar overflow-y-auto box-border p-5 bg-[#fdfbf7] flex flex-col justify-start items-start text-left';
            
            const list = document.createElement('ul');
            list.className = 'list-disc pl-5 space-y-3 text-sm leading-relaxed text-[#374151] mt-2 mb-2 w-full pr-2';
            
            star.points.forEach(point => {
                const li = document.createElement('li');
                li.innerText = point;
                list.appendChild(li);
            });

            back.appendChild(list);

            // Assemble
            flipper.appendChild(front);
            flipper.appendChild(back);
            cardWrapper.appendChild(flipper);
            gridContainer.appendChild(cardWrapper);
        });

    </script>
