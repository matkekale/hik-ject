<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Pelipatan Jaring-Jaring Kubus 3D (Revisi Matte & Dua Sisi)</title>
    <!-- Tailwind CSS untuk tata letak modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library FontAwesome untuk ikon menarik -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111827;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Custom styling untuk slider agar terlihat premium */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            background: #374151;
            border-radius: 9999px;
            height: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -4px;
            background-color: #3b82f6;
            border-radius: 9999px;
            height: 16px;
            width: 16px;
            transition: all 0.15s ease-in-out;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background-color: #60a5fa;
            transform: scale(1.2);
        }
    </style>
</head>
<body class="text-white select-none">

    <!-- Kontainer Canvas Utama -->
    <div id="canvas-container" class="w-full h-screen absolute inset-0 z-0"></div>

    <!-- UI Overlay Atas -->
    <div class="absolute top-4 left-4 right-4 z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pointer-events-none">
        <div class="bg-gray-900/80 backdrop-blur-md p-4 rounded-xl border border-gray-800 shadow-2xl max-w-md pointer-events-auto">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent flex items-center gap-2">
                <i class="fa-solid fa-cube animate-pulse"></i> Visualisasi Kubus 3D (Matte & Sisi Ganda)
            </h1>
            <p class="text-xs text-gray-400 mt-1">
                Sisi luar dan dalam kini memiliki warna stiker yang sama persis dengan tekstur Dove (Matte) bebas pantulan cahaya mengkilap.
            </p>
        </div>

        <!-- Indikator Status -->
        <div class="bg-gray-900/80 backdrop-blur-md px-4 py-2 rounded-lg border border-gray-800 pointer-events-auto flex items-center gap-3">
            <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span id="status-label" class="text-sm font-semibold text-emerald-400">Jaring-Jaring (Terbuka)</span>
        </div>
    </div>

    <!-- UI Kontrol Bawah -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 w-11/12 max-w-xl bg-gray-900/95 backdrop-blur-lg p-6 rounded-2xl border border-gray-800 shadow-2xl pointer-events-auto flex flex-col gap-4">
        
        <!-- Slider Kontrol Pelipatan -->
        <div class="flex flex-col gap-2">
            <div class="flex justify-between items-center text-sm font-medium">
                <span class="text-gray-400">Datar (0%)</span>
                <span id="fold-percentage" class="text-blue-400 font-bold text-base">Terbuka (0%)</span>
                <span class="text-gray-400">Kubus (100%)</span>
            </div>
            <input id="fold-slider" type="range" min="0" max="100" value="0" class="w-full">
        </div>

        <!-- Tombol Aksi -->
        <div class="flex justify-between items-center gap-2 mt-1">
            <button id="btn-toggle" class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20">
                <i id="btn-icon" class="fa-solid fa-play"></i>
                <span id="btn-text">Lipat Otomatis</span>
            </button>
            <button id="btn-reset" class="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 text-gray-300 font-semibold py-2.5 px-4 rounded-xl transition duration-200 flex items-center gap-2 border border-gray-700">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                <span>Reset</span>
            </button>
        </div>
    </div>

    <!-- Petunjuk Interaksi Layar Sentuh / Mouse -->
    <div class="absolute bottom-32 md:bottom-6 left-6 z-10 hidden md:flex items-center gap-4 text-xs text-gray-400 bg-gray-900/50 backdrop-blur-sm p-3 rounded-lg border border-gray-800/50 pointer-events-none">
        <div class="flex items-center gap-1.5"><i class="fa-solid fa-mouse-pointer text-blue-400"></i> Klik & seret untuk putar</div>
        <div class="flex items-center gap-1.5"><i class="fa-solid fa-arrows-to-eye text-blue-400"></i> Scroll untuk zoom</div>
    </div>

    <!-- Library Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Data Warna Sesuai Gambar referensi Anda
        const COLORS = {
            W: '#FFFFFF',
            G: '#4CAF50',
            B: '#2563EB',
            O: '#F97316',
            R: '#EF4444',
            Y: '#FDE047'
        };

        // Representasi jaring-jaring 3x3 per sisi
        const FACES_DATA = {
            front: [
                ['O', 'O', 'Y'],
                ['Y', 'R', 'G'],
                ['G', 'O', 'B']
            ],
            top: [
                ['W', 'G', 'B'],
                ['R', 'W', 'O'],
                ['W', 'Y', 'B']
            ],
            bottom: [
                ['W', 'G', 'W'],
                ['B', 'Y', 'R'],
                ['R', 'W', 'O']
            ],
            left: [
                ['G', 'Y', 'B'],
                ['O', 'B', 'B'],
                ['G', 'W', 'R']
            ],
            right: [
                ['O', 'W', 'R'],
                ['W', 'B', 'R'],
                ['R', 'G', 'G']
            ],
            farRight: [
                ['Y', 'Y', 'O'],
                ['B', 'O', 'B'],
                ['Y', 'R', 'Y']
            ]
        };

        // Inisialisasi Three.js
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111827); // Abu-abu gelap premium
        
        // Kabut halus untuk kedalaman 3D
        scene.fog = new THREE.FogExp2(0x111827, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -1.5, 0); 
        controls.minDistance = 5;
        controls.maxDistance = 30;

        // Pencahayaan Studio
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x90e0ef, 0.4);
        fillLight.position.set(-15, -10, -15); 
        scene.add(fillLight);

        const pointLight = new THREE.PointLight(0x22d3ee, 0.5, 15);
        pointLight.position.set(0, 3, 0);
        scene.add(pointLight);

        // Grid Lantai
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1f2937, 
            roughness: 1.0, // Matte / Dove floor
            metalness: 0.0
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -5.0; 
        floor.receiveShadow = true;
        scene.add(floor);

        const gridHelper = new THREE.GridHelper(50, 50, 0x374151, 0x1f2937);
        gridHelper.position.y = -4.99;
        scene.add(gridHelper);

        const SIZE = 3; 

        // Fungsi membuat satu sisi berukuran 3x3 dengan stiker di kedua sisi (atas & bawah)
        function createFaceMesh(faceKey, hasHighlight = false) {
            const group = new THREE.Group();

            // Pelat Hitam Dasaran Sisi (Base Plate) - Berbahan Matte/Dove
            const baseGeo = new THREE.BoxGeometry(SIZE, 0.08, SIZE);
            const baseMat = new THREE.MeshStandardMaterial({ 
                color: 0x0c0a09, 
                roughness: 1.0, // Matte total
                metalness: 0.0  // Tanpa logam pantul
            });
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            group.add(baseMesh);

            // Bingkai Biru Toska (Cyan) untuk sisi Alas
            if (hasHighlight) {
                const borderGeo = new THREE.BoxGeometry(SIZE + 0.15, 0.12, SIZE + 0.15);
                const borderMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee }); 
                const borderMesh = new THREE.Mesh(borderGeo, borderMat);
                borderMesh.position.y = -0.02;
                group.add(borderMesh);
            }

            // Stiker Warna-warni (Grid 3x3) - Diletakkan di Sisi Atas DAN Sisi Bawah
            const stickerData = FACES_DATA[faceKey];
            const stickerSize = 0.9;
            const stickerThickness = 0.02; // Tipis agar menempel sempurna di kedua permukaan
            const stickerGeo = new THREE.BoxGeometry(stickerSize, stickerThickness, stickerSize);

            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const colorCode = stickerData[r][c];
                    const colorHex = COLORS[colorCode];
                    
                    // Material stiker Dove / Matte sepenuhnya
                    const stickerMat = new THREE.MeshStandardMaterial({
                        color: new THREE.Color(colorHex),
                        roughness: 1.0, // Menghilangkan kilau cahaya sepenuhnya
                        metalness: 0.0  // Non-metalik
                    });

                    // 1. Stiker Sisi Atas (Menghadap Luar ketika datar / Menghadap Dalam/Luar sesuai lipatan)
                    const stickerMeshTop = new THREE.Mesh(stickerGeo, stickerMat);
                    const posX = (c - 1) * 1.0;
                    const posZ = (r - 1) * 1.0;
                    stickerMeshTop.position.set(posX, 0.05, posZ);
                    stickerMeshTop.castShadow = true;
                    group.add(stickerMeshTop);

                    // 2. Stiker Sisi Bawah (Sama persis tata letaknya agar bolak-balik identik)
                    const stickerMeshBottom = new THREE.Mesh(stickerGeo, stickerMat);
                    stickerMeshBottom.position.set(posX, -0.05, posZ);
                    stickerMeshBottom.castShadow = true;
                    group.add(stickerMeshBottom);
                }
            }

            return group;
        }

        // --- SISTEM HIERARKI SISI 'RIGHT' SEBAGAI ALAS UTAMA ---
        // 1. SISI ALAS (Right)
        const pivotRight = new THREE.Group();
        pivotRight.position.set(0, 0, 0);
        scene.add(pivotRight);

        const meshRight = createFaceMesh('right', true); 
        pivotRight.add(meshRight);

        // 2. SISI KANAN SEKALI (Far Right)
        const pivotFarRight = new THREE.Group();
        pivotFarRight.position.set(SIZE/2, 0, 0); 
        pivotRight.add(pivotFarRight);

        const meshFarRight = createFaceMesh('farRight');
        meshFarRight.position.set(SIZE/2, 0, 0); 
        pivotFarRight.add(meshFarRight);

        // 3. SISI TENGAH/DEPAN (Front)
        const pivotFront = new THREE.Group();
        pivotFront.position.set(-SIZE/2, 0, 0); 
        pivotRight.add(pivotFront);

        const meshFront = createFaceMesh('front');
        meshFront.position.set(-SIZE/2, 0, 0);
        pivotFront.add(meshFront);

        // 4. SISI KIRI (Left)
        const pivotLeft = new THREE.Group();
        pivotLeft.position.set(-SIZE, 0, 0); 
        pivotFront.add(pivotLeft);

        const meshLeft = createFaceMesh('left');
        meshLeft.position.set(-SIZE/2, 0, 0);
        pivotLeft.add(meshLeft);

        // 5. SISI ATAS (Top)
        const pivotTop = new THREE.Group();
        pivotTop.position.set(-SIZE/2, 0, -SIZE/2); 
        pivotFront.add(pivotTop);

        const meshTop = createFaceMesh('top');
        meshTop.position.set(0, 0, -SIZE/2);
        pivotTop.add(meshTop);

        // 6. SISI BAWAH (Bottom)
        const pivotBottom = new THREE.Group();
        pivotBottom.position.set(-SIZE/2, 0, SIZE/2); 
        pivotFront.add(pivotBottom);

        const meshBottom = createFaceMesh('bottom');
        meshBottom.position.set(0, 0, SIZE/2);
        pivotBottom.add(meshBottom);


        // --- LOGIKA ROTASI PELIPATAN KE LUAR (OUTWARDS FOLDING) ---
        let foldProgress = 0.0; 
        let isAnimating = false;
        let animationDirection = 1;

        function updateFolding(progress) {
            const targetAngle = (Math.PI / 2) * progress;

            // Lipat ke bawah (outwards)
            pivotFarRight.rotation.z = targetAngle;
            pivotFront.rotation.z = -targetAngle;
            pivotLeft.rotation.z = -targetAngle;
            pivotTop.rotation.x = targetAngle;
            pivotBottom.rotation.x = -targetAngle;

            // Rotasi dramatis keseluruhan grup jaring-jaring
            pivotRight.rotation.x = (Math.PI / 6) * progress;
            pivotRight.rotation.y = -(Math.PI / 6) * progress;
        }

        // --- INTERAKSI UI ---
        const slider = document.getElementById('fold-slider');
        const foldPercentageLabel = document.getElementById('fold-percentage');
        const statusLabel = document.getElementById('status-label');
        const btnToggle = document.getElementById('btn-toggle');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnReset = document.getElementById('btn-reset');

        function updateLabels() {
            const percentage = Math.round(foldProgress * 100);
            slider.value = percentage;
            foldPercentageLabel.textContent = `Pelipatan (${percentage}%)`;

            if (percentage === 0) {
                statusLabel.textContent = "Jaring-Jaring (Terbuka)";
                statusLabel.className = "text-sm font-semibold text-emerald-400";
                btnText.textContent = "Lipat Otomatis";
                btnIcon.className = "fa-solid fa-play";
                animationDirection = 1;
            } else if (percentage === 100) {
                statusLabel.textContent = "Kubus Utuh (Tertutup)";
                statusLabel.className = "text-sm font-semibold text-cyan-400";
                btnText.textContent = "Buka Jaring-Jaring";
                btnIcon.className = "fa-solid fa-folder-open";
                animationDirection = -1;
            } else {
                statusLabel.textContent = "Sedang Melipat...";
                statusLabel.className = "text-sm font-semibold text-yellow-400";
            }
        }

        slider.addEventListener('input', (e) => {
            isAnimating = false;
            foldProgress = e.target.value / 100;
            updateFolding(foldProgress);
            updateLabels();
        });

        btnToggle.addEventListener('click', () => {
            isAnimating = !isAnimating;
            if (isAnimating) {
                btnText.textContent = "Pause";
                btnIcon.className = "fa-solid fa-pause";
            } else {
                updateLabels();
            }
        });

        btnReset.addEventListener('click', () => {
            isAnimating = false;
            foldProgress = 0.0;
            animationDirection = 1;
            updateFolding(foldProgress);
            updateLabels();
            
            controls.reset();
            camera.position.set(0, 8, 14);
            controls.target.set(0, -1.5, 0);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop Animasi Utama
        const clock = new THREE.Clock();

        window.onload = function() {
            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();

                if (isAnimating) {
                    const speed = 0.35; 
                    foldProgress += animationDirection * speed * delta;

                    if (foldProgress >= 1.0) {
                        foldProgress = 1.0;
                        isAnimating = false;
                    } else if (foldProgress <= 0.0) {
                        foldProgress = 0.0;
                        isAnimating = false;
                    }

                    updateFolding(foldProgress);
                    updateLabels();
                }

                // Rotasi otomatis lambat pada alas saat mode diam
                if (!controls.state === -1) {
                    pivotRight.rotation.y += 0.003;
                }

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        };
    </script>
</body>
</html>
